<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chunk Upload with Resume</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-6 text-gray-800">File Upload System</h1>
        
        <!-- File Upload Area -->
        <div id="uploadArea" class="space-y-4">
            <!-- File Input Area -->
            <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center" id="dropZone">
                <input type="file" id="fileInput" class="hidden" />
                <label for="fileInput" class="cursor-pointer">
                    <div class="text-gray-600">
                        <svg class="mx-auto h-12 w-12 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                        </svg>
                        <p class="text-sm">Drag and drop your file here or <span class="text-blue-500">browse</span></p>
                    </div>
                </label>
            </div>

            <!-- File Info -->
            <div id="fileInfo" class="hidden bg-gray-50 p-4 rounded-lg">
                <p class="text-sm text-gray-600">Selected file: <span id="fileName" class="font-medium"></span></p>
                <p class="text-sm text-gray-600">Size: <span id="fileSize" class="font-medium"></span></p>
            </div>

            <!-- Buttons -->
            <div class="flex space-x-3">
                <button onclick="startUpload()" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg disabled:opacity-50" id="uploadBtn" disabled>
                    Upload
                </button>
                <button onclick="resumeUpload()" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg disabled:opacity-50" id="resumeBtn" disabled>
                    Resume
                </button>
            </div>

            <!-- Progress Container -->
            <div class="hidden" id="progressContainer">
                <div class="flex justify-between text-sm text-gray-600 mb-1">
                    <span>Progress</span>
                    <span id="progressText">0%</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2.5">
                    <div id="progressBar" class="bg-blue-500 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>

            <!-- Status Message -->
            <div id="statusMessage" class="hidden text-sm rounded-lg p-3"></div>
        </div>
    </div>

    <script src="{{ url_for('static', path='js/upload.js') }}"></script>
</body>
</html>
