<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chunk Upload with Resume</title>
    <style>
        #progressBar {
            width: 100%;
            background-color: #f3f3f3;
            border: 1px solid #ccc;
            margin-top: 10px;
        }
        #progressBar span {
            display: block;
            height: 20px;
            background-color: #4caf50;
            width: 0;
            color: #fff;
            text-align: center;
            line-height: 20px;
        }
    </style>
</head>
<body>
    <input type="file" id="fileInput" />
    <button onclick="startUpload()">Upload</button>
    <button onclick="resumeUpload()">Resume</button>
    <div id="progressBar"><span id="progressText">0%</span></div>

    <script>
        let uploadQueue = {};
        let currentChunkIndex = 0;
        let totalChunks = 0;
        let fileName = '';
        let fileSize = 0;

        function startUpload() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            fileSize = file.size;
            const chunkSize = 1024 * 1024; // 1MB
            totalChunks = Math.ceil(fileSize / chunkSize);
            fileName = file.name;  // Store the original file name
            uploadQueue = {};

            for (let i = 0; i < totalChunks; i++) {
                const start = i * chunkSize;
                const end = Math.min(start + chunkSize, fileSize);
                const chunk = file.slice(start, end);
                uploadQueue[i] = { chunk, index: i };
            }

            currentChunkIndex = 0;
            uploadNextChunk();
        }

        function uploadNextChunk() {
            if (currentChunkIndex >= totalChunks) {
                console.log('Upload complete');
                return;
            }

            if (!uploadQueue[currentChunkIndex]) {
                currentChunkIndex++;
                uploadNextChunk();
                return;
            }

            const { chunk, index } = uploadQueue[currentChunkIndex];
            const formData = new FormData();
            formData.append('part_number', index + 1); // part_number is 1-based index
            formData.append('total_parts', totalChunks);
            formData.append('file', chunk);
            formData.append('file_name', fileName);  // Send original file name

            fetch('/upload_part/', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.message.includes('uploaded') || data.message.includes('complete')) {
                    delete uploadQueue[currentChunkIndex];
                    currentChunkIndex++;
                    updateProgressBar();
                    uploadNextChunk();
                } else {
                    console.error('Error:', data.message);
                }
            })
            .catch(error => console.error('Error:', error));
        }

        function updateProgressBar() {
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            const percent = (currentChunkIndex / totalChunks) * 100;
            progressBar.style.width = percent + '%';
            progressText.textContent = Math.round(percent) + '%';
        }

        function resumeUpload() {
            fetch(`/resume-upload?file_name=${fileName}`)
                .then(response => response.json())
                .then(data => {
                    currentChunkIndex = data.chunk_index;
                    console.log(`Resuming from chunk ${currentChunkIndex}`);
                    uploadNextChunk();
                })
                .catch(error => console.error('Error resuming upload:', error));
        }
    </script>
</body>
</html>
